[package]
name = "exploretv-wld-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Original bounded WLD column-index and rectangle decoder for exploreTV"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench-world"
path = "src/bin/bench-world.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
