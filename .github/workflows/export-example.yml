name: Export full-resolution example
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requested:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          message=$(git log -1 --format=%B)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            case "$message" in
              *'[export-full]'*) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
              *) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
            esac
          fi
  export:
    needs: requested
    if: needs.requested.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/prepare-example.mjs example/assets --check
      - run: node --test test/png-stream.test.mjs test/export-world.test.mjs
      - run: node scripts/run-export-ci.mjs
      - run: node scripts/verify-export.mjs artifacts/full-resolution/world-16px.png --tiles artifacts/full-resolution/tiles
      - uses: actions/upload-artifact@v4
        with:
          name: full-resolution-panorama-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/full-resolution/world-16px.png
            artifacts/full-resolution/world-16px.png.json
            artifacts/full-resolution/world-16px.png.verification.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: full-resolution-tiles-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/full-resolution/tiles/
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: full-resolution-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/full-resolution/*.json
            artifacts/full-resolution/tiles/manifest.json
          retention-days: 7
