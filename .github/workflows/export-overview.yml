name: Compare complete panorama with pinned main
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requested:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.title != null
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          message=$(git log -1 --format=%B)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            case "$PR_TITLE $message" in
              *'[export-overview]'*) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
              *) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
            esac
          fi
  export:
    needs: requested
    if: needs.requested.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_COMMIT: fae6f52a5227cef3f6544f383d074f10da84e1e0
      EXPLORETV_DISABLE_FRAME_PACK: "0"
      EXPLORETV_FRAME_PACK_COPY_PIXELS: "1"
      EXPLORETV_DISABLE_WASM_FRAME_STREAM: "0"
      EXPLORETV_DISABLE_TERRAIN_WASM: "0"
      EXPLORETV_ENABLE_RESOLVED_CELL_MASK: "0"
      EXPLORETV_DISABLE_RESOLVED_CELL_MASK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:overview
      - run: node scripts/check-overview-native.mjs
      - run: node scripts/prepare-example.mjs example/assets --check
      - name: Precompile world-independent terrain frames and record resource preparation cost
        run: npm run prepare:overview-frames -- example/assets artifacts/overview-frame-pack
      - run: node --test test/png-stream.test.mjs test/export-world.test.mjs test/overview-export.test.mjs test/overview-fast-path.test.mjs test/scene-frame-cache.test.mjs test/compact-waterfall-registry.test.mjs test/overview-budget.test.mjs test/png-rgba.test.mjs test/png-rgba-node.test.mjs test/overview-core-cull.test.mjs test/static-planner-dispatch.test.mjs test/raw-texture-cache.test.mjs test/overview-comparison.test.mjs
      - run: node --test test/native-reducer.test.mjs test/native-blitter.test.mjs test/software-overview-partition.test.mjs test/software-overview-composite.test.mjs test/overview-frame-metadata.test.mjs test/scene-frame-interner.test.mjs test/ordinary-planner-fast-path.test.mjs test/indexed-shimmer-hint.test.mjs test/process-memory.test.mjs test/raw-overview-frame.test.mjs test/raw-identity-preparation.test.mjs test/slope-overview-frame.test.mjs test/reduce-overview-canvas.test.mjs test/native-provenance.test.mjs test/overview-early-halo-cull.test.mjs
      - run: node --test test/world-validation-memo.test.mjs test/renderer-slope-polygons.test.mjs test/scene-frame-id.test.mjs test/renderer-emission-core.test.mjs test/overview-shared-geometry.test.mjs test/compact-overview-ci.test.mjs
      - run: node --test test/compact-overview-planner.test.mjs test/overview-terrain-wasm.test.mjs test/compact-terrain-engine.test.mjs test/direct-terrain-overview.test.mjs
      - run: node --test test/compact-ablation.test.mjs test/liquid-visible-level-cache.test.mjs
      - run: node --test test/overview-frame-pack.test.mjs test/overview-frame-stream.test.mjs test/frame-pack-comparison.test.mjs
      - name: Measure pinned baseline on this runner
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const base = JSON.parse(execFileSync('git', ['show', process.env.BASELINE_COMMIT + ':package-lock.json'], { encoding: 'utf8' }));
          const current = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [path, entry] of Object.entries(base.packages))
            if (path) assert.deepEqual(current.packages[path], entry, 'Unchanged rendering dependency: ' + path);
          NODE
          baseline="$RUNNER_TEMP/exploretv-overview-baseline"
          git worktree add --detach "$baseline" "$BASELINE_COMMIT"
          test "$(git -C "$baseline" rev-parse HEAD)" = "$BASELINE_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cd "$baseline"
          npm run prepare:overview
          node scripts/check-overview-native.mjs
          node scripts/prepare-example.mjs example/assets --check
          node scripts/run-overview-ci.mjs "$GITHUB_WORKSPACE/artifacts/direct-overview-baseline"
          node scripts/verify-overview.mjs fixtures/example-world.wld example/assets "$GITHUB_WORKSPACE/artifacts/direct-overview-baseline/world-1px.png" --example
      - run: node scripts/run-overview-ci.mjs
        env:
          EXPLORETV_FRAME_PACK_DIR: ${{ github.workspace }}/artifacts/overview-frame-pack
      - run: node scripts/verify-overview.mjs fixtures/example-world.wld example/assets artifacts/direct-overview/world-1px.png --example
      - name: Compare complete sequential runs
        run: |
          node scripts/compare-overview-benchmarks.mjs \
            artifacts/direct-overview-baseline artifacts/direct-overview \
            "$(git rev-parse HEAD)" "$BASELINE_COMMIT" \
            "$RUNNER_TEMP/exploretv-overview-baseline" "$GITHUB_WORKSPACE"
      - name: Measure the same candidate with dynamic frames and WASM stream
        env:
          EXPLORETV_FRAME_PACK_DIR: ${{ github.workspace }}/artifacts/overview-frame-pack
          EXPLORETV_DISABLE_FRAME_PACK: "1"
        run: node scripts/run-overview-ci.mjs artifacts/dynamic-frames
      - run: node scripts/verify-overview.mjs fixtures/example-world.wld example/assets artifacts/dynamic-frames/world-1px.png --example
      - name: Measure the same candidate with precompiled frames and legacy command planning
        env:
          EXPLORETV_FRAME_PACK_DIR: ${{ github.workspace }}/artifacts/overview-frame-pack
          EXPLORETV_DISABLE_WASM_FRAME_STREAM: "1"
        run: node scripts/run-overview-ci.mjs artifacts/legacy-frame-planning
      - run: node scripts/verify-overview.mjs fixtures/example-world.wld example/assets artifacts/legacy-frame-planning/world-1px.png --example
      - name: Compare complete same-commit feature ablations
        run: |
          node scripts/compare-frame-pack-benchmarks.mjs \
            artifacts/direct-overview artifacts/dynamic-frames artifacts/legacy-frame-planning \
            "$(git rev-parse HEAD)" "$GITHUB_WORKSPACE" \
            artifacts/overview-frame-pack/build-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-small-panorama-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/direct-overview/world-1px.png
            artifacts/direct-overview/*.json
            artifacts/direct-overview-baseline/*.json
            artifacts/dynamic-frames/*.json
            artifacts/legacy-frame-planning/*.json
            artifacts/overview-frame-pack/manifest.json
            artifacts/overview-frame-pack/build-report.json
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precompiled-terrain-frames-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/overview-frame-pack/
          compression-level: 6
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-panorama-${{ env.BASELINE_COMMIT }}
          path: artifacts/direct-overview-baseline/world-1px.png
          compression-level: 0
          retention-days: 7
