name: Validate scene fragment slice
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned official Rust WASM target
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
      - name: Rebuild and verify committed WASM artifact
        run: |
          sh wasm-core/build.sh
          git diff --exit-code -- wasm-core/dist/
      - name: Test original Rust core
        working-directory: wasm-core
        run: cargo test --locked
      - run: npm ci --ignore-scripts
      - run: npm run prepare:overview
      - run: node scripts/check-overview-native.mjs
      - run: npm test
      - run: node scripts/prepare-example.mjs example/assets --check
      - run: node scripts/audit-world.mjs fixtures/example-world.wld example/assets artifacts/current-coverage.json
      - run: node scripts/verify-waterfall-render.mjs
      - run: node scripts/verify-world.mjs fixtures/example-world.wld d551a6b360c7af49a07dadbb1e82223ac43ad398e2054c29f500ec5e8b5b1cab
      - run: npm run build:h5
      - run: npm run build:mp-weixin
      - run: node scripts/check-mp.mjs
      - run: npx playwright install --with-deps chromium
      - name: Measure JS and WASM with the real world in Node and Chromium
        run: |
          mkdir -p artifacts
          node scripts/bench-world-wasm.mjs --output artifacts/wasm-node.json
          node scripts/bench-world-wasm.mjs --browser --output artifacts/wasm-chromium.json
      - run: node --test scripts/test-waterfall-worker-browser.mjs
      - run: npx playwright test
      - run: mkdir -p artifacts && git archive --format=zip --output=artifacts/exploreTV-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-fixture-validation
          path: |
            artifacts/
            playwright-report/
            dist/build/
          retention-days: 7
